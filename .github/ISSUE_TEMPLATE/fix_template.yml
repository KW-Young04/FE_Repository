name: "🐛 Fix"
description: 버그 수정 및 오류 해결을 위한 이슈를 작성합니다.
title: "[Fix]: "
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: 🚨 버그 설명
      description: 발생한 문제나 비정상적인 동작을 간략히 설명해주세요.
      placeholder: 어떤 문제가 발생하고 있는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 🔁 재현 방법
      description: 버그를 동일하게 재현할 수 있는 단계를 순서대로 작성해주세요.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 수정할 내용
      description: 해결을 위해 진행할 작업 목록을 체크박스 형태로 작성해주세요.
      placeholder: |
        - [ ] 최대한 세분화 해서 적어주세요!
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 🙋 참고 자료
      description: 에러 로그, 캡처 화면, 참고 링크 등이 있다면 작성해 주세요.
      placeholder: 콘솔 에러 로그나 스크린샷 등을 첨부해주세요.
    validations:
      required: false
